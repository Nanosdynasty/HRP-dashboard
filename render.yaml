services:
  - type: web
    name: hrp-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: XAI_API_KEY
        sync: false   # set manually in Render dashboard for real Grok
      - key: AISSTREAM_API_KEY
        sync: false   # required for background live-vessel collection
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ADMIN_TOKEN
        sync: false   # protects refresh, upload and relationship-approval operations
      - key: HRP_STORAGE_DIR
        value: "/var/data/hrp"
      - key: AIS_RAW_RETENTION_DAYS
        value: "90"

